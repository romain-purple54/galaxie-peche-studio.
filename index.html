
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GALAXIE PÊCHE Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:#fff;font:16px system-ui}
main{max-width:720px;margin:auto;padding:20px}
h1{color:#c69aff;margin-bottom:4px}
h2{font-size:19px}
p,small{color:#ccc}
label{display:block;margin:18px 0 7px;font-weight:600}
input,select,textarea,button{
 width:100%;padding:13px;border-radius:10px;
 border:1px solid #555;background:#242430;
 color:white;font:inherit
}
button{background:#753cc8;border:0;margin-top:12px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
textarea{min-height:280px;resize:vertical}
.card{background:#1b1b27;padding:16px;border-radius:14px;margin-top:18px}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;background:#343444}
.tabs button.active{background:#753cc8}
img{max-width:100%;border-radius:12px;margin-top:12px}
a{color:#c69aff;overflow-wrap:anywhere}
#status{white-space:pre-wrap}
#sources a,#variantSources a{display:block;margin:9px 0}
.hidden{display:none}
.notice{color:#ffcf8b}
.variant-item{
 display:flex;align-items:flex-start;gap:12px;
 padding:12px;margin:9px 0;background:#282838;
 border:1px solid #45455c;border-radius:10px;
 cursor:pointer
}
.variant-item input{width:auto;margin:4px 0}
.variant-item strong{display:block}
.variant-item small{display:block;margin-top:5px}
</style>
</head>
<body>
<main>
<h1>🎣 GALAXIE PÊCHE Studio</h1>
<p>Des publications professionnelles adaptées à chaque référence.</p>

<div class="card">
<label for="photo">Photo personnelle du produit (facultative)</label>
<input id="photo" type="file" accept="image/*">
<img id="preview" alt="Photo importée" hidden>

<label for="ean">Code-barres EAN ou référence</label>
<input id="ean" placeholder="Ex. 1234567890123">

<label for="name">Nom du produit</label>
<input id="name" placeholder="Ex. Shimano Stella FK">

<button id="searchVariants" type="button">
Rechercher les modèles disponibles
</button>

<p id="status" role="status"></p>
</div>

<div id="variantCard" class="card hidden">
<h2>Choisir la référence exacte</h2>
<p>Sélectionne le modèle correspondant à ton produit.</p>
<div id="variantList"></div>

<label for="manualVariant">Ou saisir une référence précise</label>
<input id="manualVariant" placeholder="Ex. STELLA 2500S FK">

<button id="generate" type="button">
Créer les publications
</button>

<h2>Sources de la recherche</h2>
<div id="variantSources"></div>
</div>

<div id="results" class="hidden">
<div class="card">
<h2 id="product"></h2>
<p id="verification"></p>
<p id="warnings" class="notice"></p>

<div class="tabs">
<button id="facebookTab" class="active" type="button">Facebook</button>
<button id="instagramTab" type="button">Instagram</button>
</div>

<label for="publication">Publication à copier ou modifier</label>
<textarea id="publication"></textarea>
<button id="copy" type="button">Copier la publication</button>
</div>

<div class="card">
<h2>Caractéristiques techniques documentées</h2>
<ul id="facts"></ul>
<h2>Sources consultées</h2>
<div id="sources"></div>
</div>

<div class="card">
<h2>Photos du produit</h2>
<p id="photoStatus"></p>
<img id="selectedPhoto" hidden alt="Photo du produit">
</div>
</div>
</main>

<script>
const $=id=>document.getElementById(id);

let posts={facebook:"",instagram:""};
let active="facebook";
let variants=[];
let searchedName="";
let searchedEan="";

$("photo").onchange=()=>{
 const file=$("photo").files[0];
 if(file){
  $("preview").src=URL.createObjectURL(file);
  $("preview").hidden=false;
 }else{
  $("preview").hidden=true;
 }
};

function showPost(platform){
 posts[active]=$("publication").value;
 active=platform;
 $("publication").value=posts[platform]||"";
 $("facebookTab").classList.toggle("active",platform==="facebook");
 $("instagramTab").classList.toggle("active",platform==="instagram");
}

$("facebookTab").onclick=()=>showPost("facebook");
$("instagramTab").onclick=()=>showPost("instagram");

function addLinks(container,items){
 container.replaceChildren();

 for(const item of items){
  const url=item.url;
  if(typeof url!=="string"||!url.startsWith("https://"))continue;

  const a=document.createElement("a");
  a.href=url;
  a.target="_blank";
  a.rel="noopener noreferrer";
  a.textContent=item.titre||item.title||url;
  container.appendChild(a);
 }
}

function showVariants(items){
 const container=$("variantList");
 container.replaceChildren();

 if(!items.length){
  const p=document.createElement("p");
  p.textContent="Aucune variante documentée trouvée. Tu peux saisir une référence exacte ci-dessous.";
  container.appendChild(p);
  return;
 }

 items.forEach((item,index)=>{
  const label=document.createElement("label");
  label.className="variant-item";

  const radio=document.createElement("input");
  radio.type="radio";
  radio.name="selectedVariant";
  radio.value=String(index);

  const details=document.createElement("span");
  const title=document.createElement("strong");
  title.textContent=item.nom||"Modèle";

  const reference=document.createElement("small");
  reference.textContent=item.reference
   ?"Référence : "+item.reference
   :"Référence fabricant non précisée";

  const description=document.createElement("small");
  description.textContent=item.description||"";

  details.append(title,reference,description);
  label.append(radio,details);
  container.appendChild(label);
 });

}

$("searchVariants").onclick=async()=>{
 const name=$("name").value.trim();
 const ean=$("ean").value.trim();

 if(!name&&!ean){
  $("status").textContent="Indique un nom ou un code-barres.";
  return;
 }

 const btn=$("searchVariants");
 btn.disabled=true;
 $("status").textContent="Recherche des variantes sur Internet...";
 $("variantCard").classList.add("hidden");
 $("results").classList.add("hidden");
 $("manualVariant").value="";

 try{
  const response=await fetch("/api/generate",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    action:"variantes",
    name,
    ean
   })
  });

  const data=await response.json();

  if(!response.ok)throw Error(data.error||"Erreur serveur");

  searchedName=name;
  searchedEan=ean;
  variants=Array.isArray(data.variantes)?data.variantes:[];

  showVariants(variants);
  addLinks($("variantSources"),data.sources||[]);
  $("variantCard").classList.remove("hidden");

  $("status").textContent=variants.length
   ?variants.length+" variante(s) trouvée(s). Sélectionne la bonne référence."
   :"Aucune variante confirmée automatiquement. Saisis la référence exacte si tu la connais.";

 }catch(error){
  $("status").textContent="Erreur : "+error.message;
 }finally{
  btn.disabled=false;
 }
};

$("generate").onclick=async()=>{
 const manual=$("manualVariant").value.trim();
 const selected=document.querySelector(
  'input[name="selectedVariant"]:checked'
 );

 let variante=manual;

 if(!variante&&selected){
  const item=variants[Number(selected.value)];
  variante=item.reference||item.nom||"";
 }

 if(!variante){
  $("status").textContent="Sélectionne ou saisis une référence exacte.";
  return;
 }

 if(
  $("name").value.trim()!==searchedName ||
  $("ean").value.trim()!==searchedEan
 ){
  $("status").textContent="Le produit a changé. Relance la recherche des modèles.";
  return;
 }

 const btn=$("generate");
 btn.disabled=true;
 $("results").classList.add("hidden");
 $("status").textContent="Vérification technique et rédaction en cours...";

 try{
  const response=await fetch("/api/generate",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    name:searchedName,
    ean:searchedEan,
    variante
   })
  });

  const data=await response.json();
  if(!response.ok)throw Error(data.error||"Erreur serveur");

  posts={
   facebook:data.facebook||"",
   instagram:data.instagram||""
  };
  active="facebook";
  $("publication").value=posts.facebook;
  $("facebookTab").classList.add("active");
  $("instagramTab").classList.remove("active");

  $("product").textContent=[
   data.produit||searchedName,
   data.reference||""
  ].filter(Boolean).join(" — ");

  $("verification").textContent=data.identification_confirmee
   ?"Référence identifiée dans la recherche."
   :"Référence exacte non confirmée.";

  $("warnings").textContent=data.avertissement||"";

  $("facts").replaceChildren();
  for(const fact of data.caracteristiques||[]){
   const li=document.createElement("li");
   li.textContent=typeof fact==="string"?fact:fact.texte||"";
   $("facts").appendChild(li);
  }

  addLinks($("sources"),data.sources||[]);

  const uploaded=$("photo").files[0];
  if(uploaded){
   $("selectedPhoto").src=URL.createObjectURL(uploaded);
   $("selectedPhoto").hidden=false;
   $("photoStatus").textContent=
    "Photo importée : vérifie que tu disposes des droits d'utilisation.";
  }else{
   $("selectedPhoto").hidden=true;
   $("photoStatus").textContent="Aucune photo autorisée confirmée.";
  }

  $("results").classList.remove("hidden");
  $("status").textContent=posts.facebook||posts.instagram
   ?"Publications prêtes !"
   :"Référence ou données techniques insuffisamment confirmées. Consulte les avertissements.";

  $("results").scrollIntoView({behavior:"smooth"});

 }catch(error){
  $("status").textContent="Erreur : "+error.message;
 }finally{
  btn.disabled=false;
 }
};

$("copy").onclick=async()=>{
 try{
  await navigator.clipboard.writeText($("publication").value);
  posts[active]=$("publication").value;
  $("status").textContent="Publication copiée !";
 }catch{
  $("status").textContent="Sélectionne le texte pour le copier.";
 }
};
</script>
</body>
</html>
