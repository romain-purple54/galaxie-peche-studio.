<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GALAXIE PÊCHE Studio</title><style>body{background:#101018;color:white;font:16px system-ui;margin:0}main{max-width:680px;margin:auto;padding:22px}h1{color:#c39bff}label{display:block;margin:18px 0 6px}input,textarea,button{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;border:1px solid #555;background:#22232e;color:white;font:inherit}button{background:#753cc8;border:0;margin-top:18px;font-weight:bold}button:disabled{opacity:.6}textarea{min-height:230px}small{color:#bbb}img{max-width:100%;max-height:320px;object-fit:contain;margin-top:10px}a{color:#cba9ff}</style><main><h1>GALAXIE PÊCHE Studio</h1><p>Photo + code-barres → publication technique et commerciale.</p><label>Photo du produit</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" hidden><label>Code-barres EAN ou référence</label><input id="ean" inputmode="numeric" placeholder="Ex. 3297830123456"><button id="scan" type="button">Lire le code-barres sur la photo</button><label>Nom du produit (facultatif)</label><input id="name" placeholder="Marque et modèle si connus"><button id="generate">Rechercher et rédiger</button><p id="status" aria-live="polite"></p><label>Publication proposée</label><textarea id="result" placeholder="La publication apparaîtra ici..."></textarea><button id="copy">Copier la publication</button><p><small>Les informations non vérifiées ne sont pas inventées. Aucun prix n'est ajouté.</small></p></main><script>const $=id=>document.getElementById(id);$('photo').onchange=()=>{const f=$('photo').files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').hidden=false}};$('scan').onclick=async()=>{if(!('BarcodeDetector'in window)){alert('Lecture automatique indisponible sur ce navigateur. Saisis le code sous le code-barres.');return}const f=$('photo').files[0];if(!f){alert('Ajoute une photo du code-barres.');return}try{const d=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','code_128']});const found=await d.detect(await createImageBitmap(f));if(found.length)$('ean').value=found[0].rawValue;else alert('Code non détecté. Saisis-le manuellement.')}catch(e){alert('Impossible de lire ce code. Saisis-le manuellement.')}};$('generate').onclick=async()=>{const btn=$('generate');btn.disabled=true;$('status').textContent='Recherche en cours…';try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ean:$('ean').value.trim(),name:$('name').value.trim()})});const j=await r.json();if(!r.ok)throw Error(j.error||'Erreur serveur');$('result').value=j.post;$('status').textContent='Publication prête. Vérifie les informations avant diffusion.'}catch(e){$('status').textContent=e.message}finally{btn.disabled=false}};$('copy').onclick=async()=>{await navigator.clipboard.writeText($('result').value);$('status').textContent='Texte copié.'};</script></html>
